name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript, protocol, and macOS checks
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # macos-14 defaults to Xcode 15.4 / Swift 5.10. Mamachi's package
      # manifest requires Swift 6, and this toolchain is installed on the image.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Report toolchains
        run: |
          bun --version
          swift --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run project checks
        run: bun run check
